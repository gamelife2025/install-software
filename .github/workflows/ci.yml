name: CI
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o /dev/null .

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Build binary
        run: |
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" -o install-software-linux-amd64 .
          sha256sum install-software-linux-amd64 > install-software-linux-amd64.sha256
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            install-software-linux-amd64
            install-software-linux-amd64.sha256
